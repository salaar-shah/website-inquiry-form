
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Project Inquiry</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101020, #25204b);
  color: white;
  min-height: 100vh;
  padding: 35px 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: #ffffff;
  color: #222;
  padding: 32px;
  border-radius: 18px;
  box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

h1 {
  text-align: center;
  color: #242044;
  font-size: 27px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 28px;
  font-size: 14px;
  line-height: 1.5;
}

label {
  display: block;
  font-weight: 600;
  margin: 18px 0 8px;
  font-size: 14px;
}

input, textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 9px;
  outline: none;
  font-size: 15px;
  font-family: inherit;
  background: #fafafa;
}

input:focus, textarea:focus {
  border-color: #6652d9;
  box-shadow: 0 0 0 3px rgba(102,82,217,.1);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

.required {
  color: #e53935;
}

.options {
  display: flex;
  gap: 12px;
}

.option {
  flex: 1;
  padding: 15px 8px;
  text-align: center;
  border: 1px solid #ddd;
  border-radius: 9px;
  cursor: pointer;
  background: #fafafa;
  font-weight: 600;
}

.option input {
  display: none;
}

.option:has(input:checked) {
  background: #eeeaff;
  border: 2px solid #6652d9;
  color: #5742c3;
}

#otherBox {
  display: none;
}

.submit-btn {
  width: 100%;
  border: none;
  background: linear-gradient(90deg, #6652d9, #8b5cf6);
  color: white;
  padding: 16px;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 25px;
  transition: .3s;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(102,82,217,.3);
}

.note {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 16px;
}

@media(max-width:480px) {
  .container {
    padding: 23px 18px;
  }
  h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Let's Build Your Website</h1>

<p class="subtitle">
Tell us about your project. Fill out the form below
and we'll get in touch with you.
</p>

<form action="https://formsubmit.co/earnc02@gmail.com"
method="POST">

<input type="hidden" name="_subject"
value="New Website Project Inquiry">

<input type="hidden" name="_template" value="table">

<!-- Name -->
<label>Full Name <span class="required">*</span></label>
<input type="text" name="Full Name"
placeholder="Enter your full name" required>

<!-- WhatsApp -->
<label>WhatsApp Number <span class="required">*</span></label>
<input type="tel" name="WhatsApp Number"
placeholder="Enter WhatsApp number with country code"
pattern="[+0-9 ()-]{7,20}" required>

<!-- Address -->
<label>Address <span class="required">*</span></label>
<textarea name="Address"
placeholder="Enter your complete address"
required></textarea>

<!-- Email -->
<label>Email ID <span class="required">*</span></label>
<input type="email" name="Email"
placeholder="Enter your email address" required>

<!-- Budget -->
<label>Your Budget <span class="required">*</span></label>
<textarea name="Project Budget"
placeholder="Describe your budget (e.g. ₹10,000 - ₹20,000)"
required></textarea>

<!-- Website Type -->
<label>What Type of Website Do You Need?
<span class="required">*</span></label>

<div class="options">

<label class="option">
<input type="radio" name="Website Type"
value="E-commerce" required>
E-commerce
</label>

<label class="option">
<input type="radio" name="Website Type"
value="Others" required>
Others
</label>

</div>

<!-- Others Description -->
<div id="otherBox">

<label>Describe Your Website
<span class="required">*</span></label>

<textarea id="otherDescription"
name="Other Website Description"
placeholder="Describe what type of website you want..."></textarea>

</div>

<button type="submit" class="submit-btn">
Submit Your Inquiry →
</button>

<p class="note">
* All fields are required.
</p>

</form>
</div>

<script>
const options = document.querySelectorAll(
  'input[name="Website Type"]'
);

const otherBox = document.getElementById("otherBox");
const otherDescription =
  document.getElementById("otherDescription");

options.forEach(option => {
  option.addEventListener("change", function() {

    if (this.value === "Others" && this.checked) {
      otherBox.style.display = "block";
      otherDescription.required = true;
    } else if (this.checked) {
      otherBox.style.display = "none";
      otherDescription.required = false;
      otherDescription.value = "";
    }

  });
});
</script>

</body>
</html>
